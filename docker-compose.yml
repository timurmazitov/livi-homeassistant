# Домашний Assistant с интеграцией Livi.
# Репозиторий монтируется в /config/custom_components/livi (только интеграция).
services:
  homeassistant:
    image: ghcr.io/home-assistant/home-assistant:stable
    container_name: livi-ha
    restart: unless-stopped
    ports:
      - "8123:8123"
    volumes:
      - ./ha-config:/config
      - ./custom_components/livi:/config/custom_components/livi:ro
      - /etc/localtime:/etc/localtime:ro
    environment:
      - TZ=Europe/Moscow
